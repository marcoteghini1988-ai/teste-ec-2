name: Eclissi Stellare - verifiche e build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npm run verify:logic
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Eclissi-Stellare-build
          path: dist/
          if-no-files-found: error
